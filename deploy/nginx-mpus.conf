# mpus nginx reverse proxy.
# Install to /etc/nginx/sites-enabled/mpus, then: sudo nginx -t && sudo systemctl reload nginx
#
# Replace mpus.booroong.online with your domain in both server_name lines and in the two
# ssl_certificate paths. Issue certs with certbot:
#   sudo certbot --nginx -d your.domain
#
# The backend listens on 127.0.0.1:8080 (set PORT in the app .env to match proxy_pass).

# HTTP: serve the ACME challenge, send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mpus.booroong.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mpus.booroong.online;

    ssl_certificate     /etc/letsencrypt/live/mpus.booroong.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mpus.booroong.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow cat photos up to 10 MB plus multipart overhead.
    client_max_body_size 16M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
